<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pindah WhatsApp Aja Ga Si?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1115;
    color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #1a1d24;
    border-radius: 20px;
    padding: 32px 24px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 20px;
    display: block;
    border: 3px solid #2a2e37;
  }
  h1 { font-size: 1.5rem; margin-bottom: 6px; }
  .subtitle { color: #8a8f98; font-size: 0.95rem; margin-bottom: 28px; }
  label { display: block; text-align: left; font-size: 0.85rem; color: #b0b4bc; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid #2a2e37;
    background: #12141a;
    color: #fff;
    font-size: 0.95rem;
    margin-bottom: 18px;
    outline: none;
  }
  input:focus { border-color: #5b8def; }
  button {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: #fff;
    color: #111;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { background: #e5e5e5; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.9rem; }
  .status.success { color: #4ade80; }
  .status.error { color: #f87171; }
</style>
</head>
<body>

<div class="card">
  <img class="avatar" src="https://user19960.na.imgto.link/public/20260801/1000453809.avif" alt="avatar">
  <h1>kipong kontol</h1>
  <p class="subtitle">ketik dibawah ya</p>

  <form id="waForm">
    <label for="name">Preferable contact name</label>
    <input type="text" id="name" name="name" placeholder="untuk di contact ku" required>

    <label for="phone">Nomor WhatsApp</label>
    <input type="tel" id="phone" name="phone" placeholder="08xxxxxxxxxx" required>

    <button type="submit" id="submitBtn">Submit</button>
    <div class="status" id="statusMsg"></div>
  </form>
</div>

<script>
  const FORMSPREE_ENDPOINT = "https://formspree.io/f/xbdnvlqg";

  const form = document.getElementById("waForm");
  const btn = document.getElementById("submitBtn");
  const status = document.getElementById("statusMsg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = "Mengirim...";
    status.textContent = "";
    status.className = "status";

    const data = new FormData(form);

    try {
      const res = await fetch(FORMSPREE_ENDPOINT, {
        method: "POST",
        body: data,
        headers: { "Accept": "application/json" }
      });

      if (res.ok) {
        status.textContent = "Terkirim! Makasih ya~";
        status.classList.add("success");
        form.reset();
      } else {
        throw new Error("Gagal kirim");
      }
    } catch (err) {
      status.textContent = "Gagal kirim, coba lagi.";
      status.classList.add("error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Submit";
    }
  });
</script>

</body>
</html>
